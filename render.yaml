# إعداد Render: وصف خدمة الويب للمشروع
services:
  - type: web
    name: signalforge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      # ضع قيمة DATABASE_URL من Supabase Free في إعدادات Render كـ Secret.
      - key: DATABASE_URL
        sync: false
      # Optional Dune read-only research context; set this as a Render Secret.
      - key: DUNE_API_KEY
        sync: false
      # Optional Bot Admin Token to guard admin routes like /api/dune/sql in production.
      - key: BOT_ADMIN_TOKEN
        sync: false
    # ملاحظات سريعة:
    # • عند وجود DATABASE_URL ينتقل SignalForge تلقائيًا إلى PostgreSQL دائم
    #   ويستورد data/*.json مرة واحدة بدون حذف السجل الموجود.
    # • بدون DATABASE_URL يبقى التشغيل المحلي على JSON كخطة احتياطية فقط.
    # • لو عايز تليجرام: ضيف TELEGRAM_BOT_TOKEN و TELEGRAM_CHAT_ID،
    #   أو فعّلهم من الواجهة نفسها (Settings).
